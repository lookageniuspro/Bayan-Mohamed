<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#121b2e"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF0B3"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6508"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>

  <!-- Uptrend business chart -->
  <polyline points="120,430 300,330 430,360 620,250 760,290 1080,150" fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <polyline points="120,430 300,330 430,360 620,250 760,290 1080,150 1080,500 120,500 Z" fill="#D4AF37" opacity="0.08" stroke="none"/>

  <!-- Gold BM badge -->
  <rect x="90" y="90" width="120" height="120" rx="24" fill="url(#goldText)"/>
  <text x="150" y="172" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#0a0e17" text-anchor="middle">BM</text>

  <!-- Title -->
  <text x="150" y="330" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" fill="#D4AF37" letter-spacing="1">Bayan Mohamed</text>
  <text x="150" y="392" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#ffffff">أكاديمية بيان محمد - Academy</text>
  <text x="150" y="452" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9CA3AF">A luxury protected platform for business & management students</text>

  <!-- Footer pill -->
  <rect x="150" y="500" width="330" height="48" rx="24" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <text x="315" y="532" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFE082" text-anchor="middle">Master Business with Confidence</text>
</svg>
